<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --accent:#7c5cff;
    --bg-1:#16131f;
    --bg-2:#0b0b0f;
    --border:rgba(124,92,255,.18);
    --shine:#b9a6ff;
  }
  /* Сплаш наследует тему режима: фиолетовая для чита, зелёная для Vanilla */
  html[data-mode="vanilla"] {
    --accent:#4db266;
    --bg-1:#101c14;
    --bg-2:#0b0f0c;
    --border:rgba(77,178,102,.22);
    --shine:#a8f1b7;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
  .splash {
    width:100vw; height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    background:radial-gradient(120% 120% at 50% 30%, var(--bg-1) 0%, var(--bg-2) 70%);
    border:1px solid var(--border);
    border-radius:18px;
    -webkit-app-region:drag;
    animation:shellIn .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes shellIn { from{opacity:0; transform:scale(.94)} to{opacity:1; transform:scale(1)} }

  .ring {
    width:64px; height:64px; border-radius:50%;
    border:3px solid var(--border);
    border-top-color:var(--accent);
    animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg) } }

  .welcome {
    font-family:'Segoe UI', system-ui, sans-serif;
    font-size:34px; font-weight:800; letter-spacing:.5px;
    background:linear-gradient(90deg,#fff 0%, var(--shine) 50%, #fff 100%);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 2.2s linear infinite, riseIn .6s .1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes shine { to { background-position:200% center } }
  @keyframes riseIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }

  .sub {
    font-family:'Segoe UI', system-ui, sans-serif;
    font-size:12.5px; letter-spacing:3px; text-transform:uppercase;
    color:#6c6780;
    animation:riseIn .6s .25s cubic-bezier(.2,.8,.2,1) both;
  }
  .dots::after { content:''; animation:dots 1.4s steps(4,end) infinite; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
</style>
</head>
<body>
  <div class="splash">
    <div class="ring"></div>
    <div class="welcome">welcome</div>
    <div class="sub dots">загрузка</div>
  </div>
  <script>
    // main.js открывает сплэш с ?mode=… — красим в тему режима до первого кадра
    if (new URLSearchParams(location.search).get('mode') === 'vanilla') {
      document.documentElement.dataset.mode = 'vanilla';
    }
  </script>
</body>
</html>
